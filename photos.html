<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="robots" content="noindex, nofollow">
    
    <title>Pre-wedding Photos | Amy & Eugene</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-layout">
        <nav class="sidebar" id="sidebar">
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="sidebar-links">
                <li><a href="index.html">Home<br/>主頁</a></li>
                <li><a href="photos.html" class="active">Pre-wedding Photos<br/>巴黎婚照</a></li>
                <li><a href="messages.html">Messages<br/>留言</a></li>
            </ul>
        </nav>
        <main class="main-content">
            <div class="wrapper">
                <section class="gallery-grid">
                    <div class="photo-frame photo-frame--single gallery-stack">
                        <img class="gallery-img gallery-img-front" alt="Wedding photo" loading="lazy">
                        <img class="gallery-img gallery-img-back" alt="" loading="lazy" aria-hidden="true">
                    </div>
                </section>
                <div id="gallery-debug" class="gallery-debug" aria-live="polite" aria-atomic="true"></div>
            </div>

            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    var toggle = document.getElementById('navToggle');
                    var sidebar = document.getElementById('sidebar');
                    if (toggle && sidebar) {
                        toggle.addEventListener('click', function() {
                            sidebar.classList.toggle('nav-open');
                        });
                    }
                });
            </script>
            <script src="assets/js/gallery-config.js"></script>
            <script src="assets/js/main.js"></script>
        </main>
    </div>
</body>
</html>
